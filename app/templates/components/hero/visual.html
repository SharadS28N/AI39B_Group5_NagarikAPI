{# Hero Visual Component - Light Theme with Illustration Placeholder #}
<style>
  .hero__visual-content {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-12);
    position: relative;
  }

  .hero__visual-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-6);
    width: 100%;
    max-width: 420px;
  }

  .hero__visual-card {
    padding: var(--space-6);
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: var(--space-3);
    animation: slideInUp 0.6s ease-out backwards;
  }

  .hero__visual-card:nth-child(1) {
    animation-delay: 0.1s;
  }

  .hero__visual-card:nth-child(2) {
    animation-delay: 0.2s;
  }

  .hero__visual-card:nth-child(3) {
    animation-delay: 0.3s;
    grid-column: span 2;
  }

  .hero__visual-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .hero__visual-card:nth-child(1) .hero__visual-icon {
    background: var(--color-accent-light);
    color: var(--color-accent-dark);
  }

  .hero__visual-card:nth-child(2) .hero__visual-icon {
    background: #e0f2fe;
    color: #0284c7;
  }

  .hero__visual-card:nth-child(3) .hero__visual-icon {
    background: #f0fdf4;
    color: #16a34a;
  }

  .hero__visual-label {
    font-size: var(--text-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--color-text-primary);
  }

  .hero__visual-sublabel {
    font-size: var(--text-xs);
    color: var(--color-text-tertiary);
  }

  /* Floating animation for cards */
  @keyframes floatSlow {
    0%, 100% {
      transform: translateY(0px);
    }
    50% {
      transform: translateY(-8px);
    }
  }

  .hero__visual-card:nth-child(1) {
    animation: slideInUp 0.6s ease-out backwards, floatSlow 3s ease-in-out 0.6s infinite;
  }

  .hero__visual-card:nth-child(2) {
    animation: slideInUp 0.6s ease-out backwards, floatSlow 3.5s ease-in-out 0.8s infinite;
  }

  .hero__visual-card:nth-child(3) {
    animation: slideInUp 0.6s ease-out backwards, floatSlow 4s ease-in-out 1s infinite;
  }

  /* Glow effect on hover */
  .hero__visual-card {
    transition: all var(--transition-base);
  }

  .hero__visual-card:hover {
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
    border-color: var(--color-accent-primary);
    transform: translateY(-4px);
  }

  @media (max-width: 640px) {
    .hero__visual-grid {
      gap: var(--space-4);
      max-width: 100%;
    }

    .hero__visual-card {
      padding: var(--space-4);
    }

    .hero__visual-icon {
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    .hero__visual-label {
      font-size: var(--text-xs);
    }

    .hero__visual-sublabel {
      display: none;
    }
  }
</style>

<div class="hero__visual-content">
  <div class="hero__visual-grid">
    <!-- Document Verification Card -->
    <div class="hero__visual-card">
      <div class="hero__visual-icon">📄</div>
      <p class="hero__visual-label">Document OCR</p>
      <p class="hero__visual-sublabel">Extract data instantly</p>
    </div>

    <!-- Liveness Detection Card -->
    <div class="hero__visual-card">
      <div class="hero__visual-icon">📸</div>
      <p class="hero__visual-label">Liveness Check</p>
      <p class="hero__visual-sublabel">Prevent spoofing</p>
    </div>

    <!-- Compliance Card -->
    <div class="hero__visual-card">
      <div class="hero__visual-icon">✅</div>
      <p class="hero__visual-label">NRB Compliant Verification</p>
      <p class="hero__visual-sublabel">Meet all regulatory requirements</p>
    </div>
  </div>
</div>
