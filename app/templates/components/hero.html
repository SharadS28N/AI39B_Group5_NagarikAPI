<div class="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden min-h-screen flex items-center bg-grid-pattern">
  <!-- Gradient fade for grid bottom -->
  <div class="absolute bottom-0 left-0 right-0 h-64 bg-gradient-to-t from-dark to-transparent z-0"></div>

  <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 relative z-10 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-8 items-center">
      
      <!-- Left Content -->
      <div class="max-w-xl fade-up">
        <h1 class="text-5xl sm:text-6xl lg:text-[4rem] font-medium leading-[1.1] tracking-tight text-white mb-6">
          The Simpler, Safer Way<br>
          to Connect Skills
        </h1>
        <p class="text-lg text-gray-400 mb-10 leading-relaxed max-w-lg">
          Runlayer securely connects AI to the enterprise stack with custom threat detection, fine-grained permissions, and complete observability for AI deployments.
        </p>
        
        <!-- Email Form -->
        <form class="flex items-center w-full max-w-md bg-[#111] border border-gray-800 rounded-full p-1 pl-4 transition-colors focus-within:border-gray-600 focus-within:bg-[#151515]">
          <input 
            type="email" 
            placeholder="Enter your email..." 
            class="flex-grow bg-transparent border-none outline-none text-white placeholder-gray-500 text-sm py-2 px-2"
            required
          >
          <button type="submit" class="bg-white text-black font-medium text-sm py-2.5 px-6 rounded-full hover:bg-gray-100 transition-colors">
            Book a Demo
          </button>
        </form>
      </div>

      <!-- Right Isometric Illustration -->
      <div class="relative h-[500px] w-full perspective-1000 hidden lg:block fade-up delay-200">
        
        <!-- Central Hub -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 isom-card float-slow z-20">
          <div class="w-64 h-64 border border-gray-700 bg-darker/80 backdrop-blur-md rounded-2xl flex items-center justify-center relative shadow-[0_0_50px_rgba(139,92,246,0.15)] group transition-transform hover:-translate-y-2">
            <!-- 3D edges representation -->
            <div class="absolute -bottom-4 -left-4 w-full h-full border border-gray-800 rounded-2xl -z-10 bg-darker"></div>
            <div class="absolute -bottom-2 -left-2 w-full h-full border border-gray-700 rounded-2xl -z-10 bg-dark"></div>
            
            <!-- Spark icon inside -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-primary w-24 h-24">
                <circle cx="12" cy="12" r="2" fill="currentColor"/>
                <path d="M12 2v6" />
                <path d="M12 16v6" />
                <path d="M4.93 4.93l4.24 4.24" />
                <path d="M14.83 14.83l4.24 4.24" />
                <path d="M2 12h6" />
                <path d="M16 12h6" />
                <path d="M4.93 19.07l4.24-4.24" />
                <path d="M14.83 9.17l4.24-4.24" />
            </svg>
          </div>
        </div>

        <!-- Inputs side (Left/Top) -->
        <!-- Cursor -->
        <div class="absolute top-[10%] left-[20%] isom-card float-medium delay-100 z-10 w-48">
          <div class="border border-gray-700 bg-darker/90 backdrop-blur-sm rounded-xl p-4 flex items-center shadow-lg relative h-16">
            <div class="absolute -bottom-2 -left-2 w-full h-full border border-gray-800 rounded-xl -z-10 bg-dark"></div>
            <div class="w-8 h-8 rounded-lg bg-gray-800 flex items-center justify-center mr-3">
              <i data-lucide="terminal-square" class="w-5 h-5 text-gray-300"></i>
            </div>
            <span class="text-gray-300 font-medium text-sm">Cursor</span>
          </div>
        </div>

        <!-- VSCode -->
        <div class="absolute top-[35%] left-[5%] isom-card float-fast delay-200 z-10 w-48">
          <div class="border border-gray-700 bg-darker/90 backdrop-blur-sm rounded-xl p-4 flex items-center shadow-lg relative h-16">
            <div class="absolute -bottom-2 -left-2 w-full h-full border border-gray-800 rounded-xl -z-10 bg-dark"></div>
            <div class="w-8 h-8 rounded-lg bg-gray-800 flex items-center justify-center mr-3">
              <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-blue-500"><path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 0 1.479l1.323 1.202a.999.999 0 0 0 1.276.053l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.37A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/></svg>
            </div>
            <span class="text-gray-300 font-medium text-sm">VSCode</span>
          </div>
        </div>

        <!-- Claude -->
        <div class="absolute top-[60%] left-[-5%] isom-card float-slow delay-300 z-10 w-48">
          <div class="border border-gray-700 bg-darker/90 backdrop-blur-sm rounded-xl p-4 flex items-center shadow-lg relative h-16">
            <div class="absolute -bottom-2 -left-2 w-full h-full border border-gray-800 rounded-xl -z-10 bg-dark"></div>
            <div class="w-8 h-8 rounded-lg bg-[#d97757] flex items-center justify-center mr-3">
              <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-gray-300 font-medium text-sm">Claude Code</span>
          </div>
        </div>


        <!-- Outputs side (Right/Bottom) -->
        <!-- Auditing -->
        <div class="absolute top-[20%] right-[5%] isom-card float-medium delay-200 z-10 w-40">
          <div class="border border-gray-800 bg-black/60 rounded-full px-6 py-3 flex items-center justify-center shadow-lg relative backdrop-blur-sm">
             <span class="text-gray-400 font-medium text-sm tracking-wide">Auditing</span>
          </div>
        </div>

        <!-- Observability -->
        <div class="absolute top-[45%] right-[-10%] isom-card float-slow delay-100 z-10 w-48">
          <div class="border border-gray-800 bg-black/60 rounded-full px-6 py-3 flex items-center justify-center shadow-lg relative backdrop-blur-sm">
             <span class="text-gray-400 font-medium text-sm tracking-wide">Observability</span>
          </div>
        </div>

        <!-- Security -->
        <div class="absolute top-[70%] right-[10%] isom-card float-fast delay-300 z-10 w-36">
          <div class="border border-gray-800 bg-black/60 rounded-full px-6 py-3 flex items-center justify-center shadow-lg relative backdrop-blur-sm">
             <span class="text-gray-400 font-medium text-sm tracking-wide">Security</span>
          </div>
        </div>

        <!-- Connecting Lines SVG -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-40 isom-card" style="z-index: 1;">
          <defs>
             <!-- Dash animation -->
             <style>
               .dashed-line {
                 stroke-dasharray: 6;
                 animation: dash 20s linear infinite;
               }
               @keyframes dash {
                 to {
                   stroke-dashoffset: -1000;
                 }
               }
             </style>
          </defs>
          <g transform="scale(1.5) translate(-50, -50)">
              <path d="M 120 180 L 250 250" stroke="#4b5563" stroke-width="1.5" class="dashed-line" fill="none" />
              <path d="M 100 240 L 250 250" stroke="#4b5563" stroke-width="1.5" class="dashed-line" fill="none" />
              <path d="M 120 300 L 250 250" stroke="#4b5563" stroke-width="1.5" class="dashed-line" fill="none" />
              

              <path d="M 250 250 L 350 180" stroke="#4b5563" stroke-width="1.5" class="dashed-line" fill="none" />
              <path d="M 250 250 L 380 250" stroke="#4b5563" stroke-width="1.5" class="dashed-line" fill="none" />
              <path d="M 250 250 L 350 320" stroke="#4b5563" stroke-width="1.5" class="dashed-line" fill="none" />
          </g>
        </svg>

      </div>

    </div>
  </div>
</div>
