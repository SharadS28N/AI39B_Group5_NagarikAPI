<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nagarik API - a premium identity onboarding template built with Flask, Jinja, and selective React interactions." />
    <meta name="generator" content="Flask, React, Radix UI, Framer Motion, Tailwind CSS" />
    <title>{% block title %}Nagarik API | Premium Identity Onboarding{% endblock %}</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link rel="modulepreload" href="https://esm.sh/@radix-ui/react-tooltip@1.1.2" />
    <link rel="modulepreload" href="https://esm.sh/framer-motion@11.2.10" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Space Grotesk", "sans-serif"]
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}" />
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-[#050505] text-white">
    {% include 'components/navbar/header.html' %}
    
    <main class="min-h-screen">
      {% block content %}{% endblock %}
    </main>

    {% include 'components/footer/footer.html' %}
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}" defer></script>
    {% block extra_js %}{% endblock %}

  </body>
</html>
