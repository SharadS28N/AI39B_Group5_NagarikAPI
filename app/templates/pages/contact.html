{% extends 'pages/base.html' %}

{% block title %}Contact | NagarikAPI{% endblock %}

{% block content %}
<section class="panel">
    <h1>Contact</h1>
    <p>Tell us about your verification needs and we will help design the right onboarding flow.</p>
</section>
<section class="panel">
    <form method="post" action="{{ url_for('main.demo_request') }}">
        <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" required>
        </div>
        <div class="actions">
            <button class="ng-btn ng-btn--primary" type="submit">Request demo</button>
        </div>
    </form>
</section>
{% endblock %}
