{% extends 'pages/base.html' %}

{% block title %}Login | NagarikAPI{% endblock %}

{% block content %}
<section class="panel" style="max-width: 520px;">
    <h1>Log in</h1>
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
        </div>
        <div class="field">
            <label>
                <input name="remember" type="checkbox" value="1"> Remember me
            </label>
        </div>
        <div class="actions">
            <button class="ng-btn ng-btn--primary" type="submit">Login</button>
            <a class="ng-btn ng-btn--ghost" href="{{ url_for('auth.register') }}">Create account</a>
        </div>
    </form>
</section>
{% endblock %}
